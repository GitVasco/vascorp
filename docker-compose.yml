services:
    app:
        build: .
        ports:
            - "8090:80"
        # Al abrir Docker Desktop / reiniciar la Mac, el contenedor vuelve solo.
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.vasco.io:host-gateway"
        environment:
            - DB_HOST=ip_de_tu_base_de_datos
            - DB_USER=tu_usuario
            - DB_PASSWORD=tu_contraseña
            - DB_NAME=tu_base_de_datos
        volumes:
            - /Users/joel/Proyectos/vascorp:/var/www/html
            # Adjuntos helpdesk → share \\SISTEMAS-2\datos (Mac: /Volumes/datos)
            # Subcarpeta helpdesk se crea en el share con permiso de escritura.
            # Si al bootear Docker el share aún no está montado, el contenedor puede fallar:
            # montá datos y luego: docker compose up -d
            - /Volumes/datos:/var/datos/helpdesk-share
